# dsh-uni-remote bundle patch: inserts this fork's plugin entry into a profile's layer stack.
#
# Fork of dsh-remote@0.8.94 — charter in UNI.md.
# The entry id intentionally KEEPS the upstream `dsh-remote` spelling:
# lib/client.js settings slots, lib/credential.js keychain SERVICE and
# lib/update.js SELF_ENTRY_NAMES all match on it, so existing configs and
# saved credentials keep working. Only the `name:` (package id) points at
# this fork. Never mount dsh-better-sidebar here (upstream policy unchanged).
#
# ⚠️ Exactly ONE entry per package: the client-modules registry maps a package
# to its client.js by package name. Mounting the same package through a second
# row (e.g. `dsh-uni-remote/uni-sync`) makes client.js register its factory
# twice and crashes the web boot ("duplicate factory registration"). The uni
# extension (lib/uni/) is wired from the main entry's apply() instead.
- insert:
    - id: dsh-remote
      name: 'dsh-uni-remote'
